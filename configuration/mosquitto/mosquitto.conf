listener 1883
allow_anonymous true

# 输出到标准输出，由 Docker json-file 驱动收集并按大小轮转
# 不要使用 log_dest file，否则日志会写到文件，不受 max-size / max-file 限制
log_dest stdout

log_type error
log_type warning
log_type notice
log_type information

connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%d %H:%M:%S
